name: Product API Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # =========================
  # JOB 1: CI + PUSH DOCKER HUB
  # =========================
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source code test
        run: npm test

      - name: Start Product API
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Product API healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi

            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API failed to become healthy"
          cat server.log
          exit 1

      - name: Run CRUD integration test
        run: npm run test:api

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest

      - name: Show Product API logs
        if: always()
        run: cat server.log || true


  # ==================================
  # JOB 2: DEPLOY VỀ LOCAL DOCKER ENGINE
  # ==================================
  deploy-local:
    needs: integration-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker version

      - name: Pull latest Docker image
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to local Docker Engine
        run: docker compose -f docker-compose-prod.yaml up -d --force-recreate

      - name: Wait for containers
        shell: powershell
        run: |
          Start-Sleep -Seconds 20
          docker compose -f docker-compose-prod.yaml ps

      - name: Check Product API health
        shell: powershell
        run: |
          $maxAttempts = 15

          for ($i = 1; $i -le $maxAttempts; $i++) {

            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:3000/health" `
                -UseBasicParsing

              if ($response.StatusCode -eq 200) {
                Write-Host "Product API is healthy"
                exit 0
              }
            }
            catch {
              Write-Host "Waiting for Product API..."
            }

            Start-Sleep -Seconds 2
          }

          Write-Host "Product API healthcheck failed"

          docker compose -f docker-compose-prod.yaml ps
          docker logs product-api

          exit 1

      - name: Verify deployed image
        run: docker inspect product-api --format="{{.Config.Image}}"

      - name: Show running containers
        run: docker compose -f docker-compose-prod.yaml ps