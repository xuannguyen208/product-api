name: Product API Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source code test
        run: npm test

      - name: Start Product API
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Product API healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi
            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API failed to become healthy"
          cat server.log
          exit 1

      - name: Run CRUD integration test
        run: npm run test:api

      - name: Show Product API logs
        if: always()
        run: cat server.log || true